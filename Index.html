```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce - Alejandra Mendivelso</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #f5f0ff;
      color: #2d1b3d;
      padding: 20px;
      text-align: center;
      margin: 0;
    }

    h1 {
      color: #6a1b9a;
    }

    #productos {
      margin-top: 20px;
    }

    .producto {
      border: 1px solid #d1b3e8;
      background: #ffffff;
      border-radius: 8px;
      padding: 10px;
      margin: 10px;
      display: inline-block;
      width: 220px;
      vertical-align: top;
      box-shadow: 0 2px 6px rgba(106, 27, 154, 0.15);
    }

    .producto img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;

      color: #4a148c;

    .producto p {
      font-weight: bold;
      color: #6a1b9a;
    }

    .producto button,
    .carrito button {
      background-color: #7b1fa2;
      border: none;
      color: #ffffff;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .producto button:hover,
    .carrito button:hover {
      background-color: #4a148c;
    }

    .carrito {
      margin-top: 30px;
      padding: 15px;
      background: #ffffff;
      border: 1px solid #d1b3e8;
      border-radius: 8px;
      text-align: left;
      display: inline-block;
      min-width: 320px;
      max-width: 600px;
      box-shadow: 0 2px 6px rgba(106, 27, 154, 0.15);
    }

    .carrito h2 {
      color: #6a1b9a;
      text-align: center;
    }

    .carrito ul {
      padding-left: 20px;
    }

    .carrito li {
      margin-bottom: 8px;
    }

    .carrito button.vaciar {
      background-color: #8e24aa;
      margin-top: 10px;
    }

    .carrito button.vaciar:hover {
      background-color: #6a1b9a;
    }

    .boton-finalizar {
      background-color: #6a1b9a !important;
      margin-left: 5px;
    }

    .boton-finalizar:hover {
      background-color: #4a148c !important;
    }

    #total {
      color: #6a1b9a;
    }
  </style>
</head>

<body>

  <h1>🍽️ Ecommerce tienda virtual - Alejandra Mendivelso</h1>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <p>
      <strong>
        Total: $<span id="total">0.00</span>
      </strong>
    </p>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Juego de utensilios de cocina antiadherentes de 8 piezas",
        precio: 25.00,
        imagen: "https://m.media-amazon.com/images/I/71mDTOYtDSL._AC_SX300_SY300_QL70_FMwebp_.jpg"
      },
      {
        id: 2,
        nombre: "Juego de utensilios de cocina Umite de cocina, 24 piezas antiadherentes de silicona",
        precio: 18.00,
        imagen: "https://m.media-amazon.com/images/I/615CbF7dxCL._AC_SX679_.jpg"
      },
      {
        id: 3,
        nombre: "Juego de 24 piezas de platos y cuencos para 6, juego de vajilla irrompible",
        precio: 30.00,
        imagen: "https://m.media-amazon.com/images/I/71+-M7KW9lL._AC_SX679_.jpg"
      },
      {
        id: 4,
        nombre: "Juego de cubiertos con bloque, juego de 12 piezas",
        precio: 18.00,
        imagen: "https://m.media-amazon.com/images/I/71p-nLekHGL._AC_SX679_.jpg"
      },
      {
        id: 5,
        nombre: "Escurridor de platos de 2 niveles, escurridor de platos de acero inoxidable",
        precio: 22.00,
        imagen: "https://m.media-amazon.com/images/I/815ctjeHc+L._AC_SY300_SX300_QL70_FMwebp_.jpg"
      }
    ];

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");

    function mostrarProductos() {
      productos.forEach(prod => {
        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">
          <h3>${prod.nombre}</h3>
          <p>Precio: $${prod.precio.toFixed(2)}</p>

          <button onclick="agregarAlCarrito(${prod.id})">
            🛒 Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);
      });
    }

    function agregarAlCarrito(id) {
      const productoExistente = carrito.find(p => p.id === id);

      if (productoExistente) {
        productoExistente.cantidad++;
      } else {
        const producto = productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });
      }

      actualizarCarrito();
    }

    function actualizarCarrito() {
      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {
        const li = document.createElement("li");

        li.textContent =
          `${item.nombre} x${item.cantidad} - $${(
            item.precio * item.cantidad
          ).toFixed(2)}`;

        listaCarrito.appendChild(li);

        total += item.precio * item.cantidad;
        totalItems += item.cantidad;
      });

      totalCarrito.textContent = total.toFixed(2);

      actualizarTituloCarrito(totalItems);
    }

    function actualizarTituloCarrito(cantidad) {
      const titulo = document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;
    }

    function vaciarCarrito() {
      if (confirm("¿Estás seguro de que quieres vaciar el carrito?")) {
        carrito.length = 0;
        actualizarCarrito();
      }
    }

    function finalizarCompra() {
      if (carrito.length === 0) {
        alert(
          "El carrito está vacío. Agrega productos antes de finalizar la compra."
        );
        return;
      }

      alert(
        "🎉 ¡Gracias por tu compra! En breve recibirás un correo de confirmación."
      );

      carrito.length = 0;

      actualizarCarrito();
    }

    const botonFinalizar = document.createElement("button");

    botonFinalizar.textContent = "✅ Finalizar Compra";
    botonFinalizar.className = "boton-finalizar";
    botonFinalizar.onclick = finalizarCompra;

    document
      .querySelector(".carrito")
      .appendChild(botonFinalizar);

    mostrarProductos();
  </script>

</body>
</html>
